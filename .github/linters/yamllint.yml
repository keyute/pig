# A repo config replaces MegaLinter's bundled defaults (/action/lib/.automation/.yamllint.yml)
# outright — yamllint does not merge configs — so the bundled rules are restated before ours.
extends: default
rules:
  braces:
    max-spaces-inside: 1
  new-lines:
    level: warning
    type: unix
  line-length:
    max: 500
  comments:
    min-spaces-from-content: 1
  # Every file here is a single document; none carries a "---" marker.
  document-start: disable
  # Without this every workflow's "on:" key warns; values stay checked.
  truthy:
    check-keys: false
