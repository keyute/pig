version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # PiG is pre-1.0, so minor bumps can break; first matching group wins, keeping it out of non-breaking for review on its own
      pig:
        applies-to: "version-updates"
        patterns:
          - "github.com/MichaelKinsy/PiG*"
      non-breaking:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
  # Workflow actions are pinned to commit SHAs; this is what keeps them current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      non-breaking:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
